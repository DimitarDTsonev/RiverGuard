name: Проверка на RiverGuard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riverguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Тестове, типове и компилиране
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Изтегляне на кода
        uses: actions/checkout@v4

      - name: Подготовка на Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Подготовка на pnpm 11.25.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Инсталиране от lockfile
        run: pnpm install --frozen-lockfile

      - name: Модулни и API тестове
        run: pnpm test

      - name: Проверка на TypeScript
        run: pnpm typecheck

      - name: Компилиране на приложението
        run: pnpm build
